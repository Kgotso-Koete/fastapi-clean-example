[project]
name = "fastapi-clean-example"
version = "0.2"
description = "Practical Clean Architecture backend example built with FastAPI"
readme = "README.md"
requires-python = "==3.13.*"
license = "MIT"
authors = [
  { name = "Ivan Borovets", email = "ivan.r.borovets@gmail.com" },
]
dependencies = [
  "aiosmtplib==5.1.2",
  "alembic==1.20.0",
  "bcrypt==5.0.0",
  "celery[redis]==5.6.3",
  "click==8.3.3",
  "dishka==1.10.1",
  "fastapi==0.142.2",
  "fastapi-error-map==1.0.0",
  "prometheus-fastapi-instrumentator==8.1.0",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pyjwt[crypto]==2.15.1",
  "sqlalchemy==2.0.54",
  "starlette==1.7.0",
  "uuid-utils==1.0.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "asgi-lifespan==2.1.0",
  "coverage==7.14.0",
  "deptry==0.25.1",
  "httpx2==2.13.1",
  "import-linter==2.15",
  "jsonschema==4.26.0",
  "line-profiler==5.0.2",
  "mkdocs==1.6.1",
  "mkdocs-include-markdown-plugin==7.3.0",
  "mkdocs-material==9.7.7",
  "mkdocs-mermaid2-plugin==1.2.3",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pre-commit==4.6.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "radon==6.0.1",
  "ruff==0.16.10",
  "slotscheck==0.21.0",
  "tombi==1.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
  ".* = Literal\\[.*\\]",
  ".* = NewType\\(.*\\)",
  "@abc\\.abstractmethod",
  "\\.\\.\\.",
  "^\\s*raise\\s*$",
  "from .* import .*",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "import .*",
  "logger\\..*",
  "logging\\..*",
  "pass",
]

[tool.coverage.run]
relative_files = true
source = ["src"]
omit = [
  "**/__init__.py",
  "src/app/base/main/**",
  "**/main/seed.py",  # development seed data, never tested (docs/plans/agents.md 2.1)
  "**/health/**",
  "**/alembic/**",
]
concurrency = ["thread"]
branch = true

[tool.deptry]
root = ["src"]
ignore = [
  "DEP002",  # Unused dependencies
  "DEP003",  # Transitive dependencies
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.importlinter]
root_package = "app"
exclude_type_checking_imports = true

# The dependency order between units (docs/plans/16-modular-monolith.md, import rule 1).
# src/app/base/ appears twice: its main/ (the composition root) is at the top, its other
# layers at the bottom, so each part is named on its own. modules and shared are both
# required layers, so renaming or deleting either breaks the contract (tested in
# tests/base/unit/architecture/test_import_contracts.py). The alembic exception for the
# registry (-> app.base.main.modules) lets env.py map every registered unit's tables (Step 4d).
[[tool.importlinter.contracts]]
id = "unit-order"
name = "units depend only on the units below them"
type = "layers"
layers = [
  "app.base.main",
  "app.modules",
  "app.shared",
  "app.base.inbound",
  "app.base.outbound",
  "app.base.core",
]
ignore_imports = [
  "app.base.outbound.persistence_sqla.alembic.env ->  app.base.main.config.loader",
  "app.base.outbound.persistence_sqla.alembic.env ->  app.base.main.config.settings",
  "app.base.outbound.persistence_sqla.alembic.env ->  app.base.main.modules",
]

[[tool.importlinter.contracts]]
id = "clean-architecture"
name = "inner must not import outer"
type = "layers"
containers = ["app.base"]
layers = [
  "(main)",
  "inbound",
  "outbound",
  "core",
]
ignore_imports = [
  "app.base.outbound.persistence_sqla.alembic.env ->  app.base.main.config.loader",
  "app.base.outbound.persistence_sqla.alembic.env ->  app.base.main.config.settings",
  "app.base.outbound.persistence_sqla.alembic.env ->  app.base.main.modules",
]

# The same layers inside every module (docs/plans/16-modular-monolith.md, import rule 2).
# Every layer is optional, since a module has only the layers it needs; exhaustive makes
# any other folder directly inside a module an error. src/app/shared/ keeps the same
# layers (Step 5), so its outbound adapters can never reach up into its main/.
[[tool.importlinter.contracts]]
id = "unit-layers"
name = "every module, and shared, keeps the same layers inside"
type = "layers"
containers = ["app.modules.*", "app.shared"]
layers = [
  "(main)",
  "(inbound)",
  "(outbound)",
  "(core)",
]
exhaustive = true

# Modules depend on each other one way only (docs/plans/16-modular-monolith.md, import
# rule 3): Notifications may use Organizations' public API, never the reverse. exhaustive
# makes a module missing from this list an error, so each new module is placed on
# purpose. Every registered module is a required layer, so renaming or deleting its
# package breaks the contract (tested in tests/base/unit/architecture/test_import_contracts.py).
[[tool.importlinter.contracts]]
id = "module-order"
name = "modules depend on each other one way only"
type = "layers"
containers = ["app.modules"]
layers = [
  "notifications",
  "organizations",
]
exhaustive = true

# Across the boundary, a module's core reaches only base's core (docs/plans/16-modular-monolith.md,
# import rule 4): base's ports, events and entities, never its adapters or routes. The wildcard
# covers every module's core/, Organizations' too once it moves in, in Step 4.
[[tool.importlinter.contracts]]
id = "module-core-uses-base-core-only"
name = "a module's core imports only base's core"
type = "forbidden"
source_modules = ["app.modules.*.core"]
forbidden_modules = ["app.base.inbound", "app.base.outbound"]

# Across the boundary, a module's outbound never reaches base's inbound (docs/plans/16-modular-
# monolith.md, import rule 4): an adapter the app drives must not depend on what drives the app.
# It may use base's outbound and core (Organizations' reader joins base's users table). No module
# has an outbound/ yet, so on the real code this holds trivially until Organizations moves in, in
# Step 4; the fake-graph test proves it catches a violation today. shared is a source as a whole
# (Step 5): every layer of it imports only base's outbound and core, never base's inbound, which
# unit-order alone allows (shared sits above base's inbound there).
[[tool.importlinter.contracts]]
id = "outbound-not-base-inbound"
name = "a module's outbound and shared never import base's inbound"
type = "forbidden"
source_modules = ["app.modules.*.outbound", "app.shared"]
forbidden_modules = ["app.base.inbound"]

# Other modules see only Organizations' public API, its core/api.py (docs/plans/16-modular-
# monolith.md, import rule 5). The rest of the module is protected: only Organizations itself
# and base's main/ (the composition root: it registers the module and loads its settings) may
# import it. core/api.py is left off the list on purpose, so any module may import it.
[[tool.importlinter.contracts]]
id = "organizations-internals"
name = "other modules import only Organizations' core/api.py"
type = "protected"
protected_modules = [
  "app.modules.organizations.core.common",
  "app.modules.organizations.core.commands",
  "app.modules.organizations.core.queries",
  "app.modules.organizations.inbound",
  "app.modules.organizations.outbound",
  "app.modules.organizations.main",
]
allowed_importers = ["app.modules.organizations", "app.base.main"]

# Nobody but the composition root imports shared (docs/plans/16-modular-monolith.md, import
# rule 5): base's main/ binds shared's adapters to base's ports and loads its settings. No
# module and no other base layer imports it, and it has no core/api.py, since nobody needs one.
# shared's own packages may import each other: a protected contract always allows that.
[[tool.importlinter.contracts]]
id = "shared-internals"
name = "only base's main/ imports shared"
type = "protected"
protected_modules = ["app.shared"]
allowed_importers = ["app.base.main"]

# The four CQRS rules hold in base and in every module, and across the boundary between them
# (docs/plans/16-modular-monolith.md, import rule 6): each rule is one contract spanning every
# unit, so a module can't drift from base's rules. Notifications has only core/common/, so the
# module side holds trivially until Organizations moves in, in Step 4.
[[tool.importlinter.contracts]]
id = "cqrs-common-must-not-import-commands"
name = "cqrs: common must not import commands"
type = "forbidden"
source_modules = ["app.base.core.common", "app.modules.*.core.common"]
forbidden_modules = ["app.base.core.commands", "app.modules.*.core.commands"]

[[tool.importlinter.contracts]]
id = "cqrs-common-must-not-import-queries"
name = "cqrs: common must not import queries"
type = "forbidden"
source_modules = ["app.base.core.common", "app.modules.*.core.common"]
forbidden_modules = ["app.base.core.queries", "app.modules.*.core.queries"]

[[tool.importlinter.contracts]]
id = "cqrs-commands-must-not-import-queries"
name = "cqrs: commands must not import queries"
type = "forbidden"
source_modules = ["app.base.core.commands", "app.modules.*.core.commands"]
forbidden_modules = ["app.base.core.queries", "app.modules.*.core.queries"]

[[tool.importlinter.contracts]]
id = "cqrs-queries-must-not-import-commands"
name = "cqrs: queries must not import commands"
type = "forbidden"
source_modules = ["app.base.core.queries", "app.modules.*.core.queries"]
forbidden_modules = ["app.base.core.commands", "app.modules.*.core.commands"]

[[tool.importlinter.contracts]]
id = "auth-ctx"
name = "auth-ctx must use its own adapters"
type = "forbidden"
source_modules = ["app.base.outbound.auth_ctx"]
forbidden_modules = ["app.base.outbound.adapters"]

[tool.mypy]
mypy_path = ["src"]
files = [
  "scripts",
  "src",
  "tests",
]
exclude = "^.*alembic.*$"
python_version = "3.13"
strict = true
pretty = true
follow_imports = "silent"
ignore_missing_imports = true
strict_optional = true
no_implicit_optional = true
warn_no_return = true
warn_unreachable = true
enable_error_code = [
  "redundant-expr",
  "truthy-bool",
  "unused-awaitable",
  "ignore-without-code",
]
plugins = [
  "pydantic.mypy",
]

[tool.pydantic-mypy]
warn_required_dynamic_aliases = true
warn_untyped_fields = true
init_typed = true

[tool.pytest]
addopts = ["--color=yes", "-mnot(slow)", "-pno:cacheprovider"]
filterwarnings = []
markers = ["slow"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"
fix = true
unsafe-fixes = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
  "A",  # flake8-builtins
  "ASYNC",  # flake8-async
  "B",  # flake8-bugbear
  "C4",  # flake8-comprehensions
  "C90",  # mccabe
  "DTZ",  # flake8-datetimez
  "E",  # pycodestyle (Error)
  "EXE",  # flake8-executable
  "F",  # Pyflakes
  "FAST",  # FastAPI
  "FLY",  # flynt
  "FURB",  # refurb
  "G",  # flake8-logging-format
  "INP",  # flake8-no-pep420
  "I",  # isort
  "INT",  # flake8-gettext
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",  # pep8-naming
  "PERF",  # Perflint
  "PLC",  # Pylint (convention)
  "PLE",  # Pylint (error)
  "PLR5501",  # Pylint Refactor: collapsible-else-if
  "PT",  # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",  # flake8-quotes
  "RSE",  # flake8-raise
  "RUF",  # Ruff-specific rules
  "S",  # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self (SLF)
  "SLOT",  # flake8-slots
  "T10",  # flake8-debugger
  "T20",  # flake8-print
  "TC",  # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "UP",  # pyupgrade
  "W",  # pycodestyle (Warning)
]
ignore = [
  "PLR0913",  # too-many-arguments
  "PLR0917",  # too-many-positional-arguments
  "PLR6301",  # no-self-use
  "RUF001",  # ambiguous-unicode-character-string (cyrillic)
  "RUF002",  # ambiguous-unicode-character-docstring (cyrillic)
  "RUF003",  # ambiguous-unicode-character-comment (cyrillic)
  "S311",  # suspicious-non-cryptographic-random-usage
  "TC001",  # typing-only-first-party-import
  "TC002",  # typing-only-third-party-import
  "TC003",  # typing-only-standard-library-import
  "TC006",  # runtime-cast-value
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "TYPE_CHECKING is banned: keep imports at module level; resolve cycles by refactoring."

[tool.ruff.lint.isort]
combine-as-imports = true
force-wrap-aliases = true
split-on-trailing-comma = true

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
  "INP001",  # runnable scripts, not an importable package
  "T20",  # print is legitimate output here
]
"scripts/seed_db.py" = [
  "S105",  # hardcoded-password-string -- dev-only fixture password, not a real secret
]
"src/app/base/outbound/persistence_sqla/alembic/**" = ["ALL"]
"tests/**" = [
  "ARG002",  # unused-method-argument
  "PLC2801",  # unnecessary-dunder-call
  "PLR2004",  # magic-value-comparison
  "PT011",  # pytest-raises-too-broad
  "S101",  # assert
  "S105",  # hardcoded-password-string
  "S106",  # hardcoded-password-func-arg
  "S107",  # hardcoded-password-default
  "SIM300",  # yoda-conditions
]

[tool.slotscheck]
strict-imports = true
exclude-modules = '''
^app\.base\.outbound\.persistence_sqla\.alembic
'''

# The original author's username fixtures (tests/base/unit/core/common/value_objects/test_username.py)
# split "user" with separators on purpose ("u.ser-name123", "u-ser_name", "u-ser.name"), and typos
# reads the "ser" part as a misspelling. The file is the original author's and only moved in plan 16,
# so its data stays; this ignores exactly that pattern rather than allowing "ser" everywhere.
[tool.typos.default]
extend-ignore-re = ["u[._-]ser"]

[tool.typos.files]
extend-exclude = []

[tool.uv]
default-groups = ["dev"]
# Exact versions for packages this codebase only uses indirectly (they come
# in through FastAPI, pyjwt[crypto], Celery, pip-audit and pre-commit), set
# to close the vulnerabilities `make pip-audit` reported on 2026-10-07
# (docs/plans/15-upstream-autumn-2026.md, Step 1). A constraint fixes the
# version without making the package a direct dependency, so deptry still
# sees only what the code imports. Like every other pin here, bump by hand.
constraint-dependencies = [
  "anyio==4.14.2",
  "cryptography==50.0.0",
  "msgpack==1.2.1",
  "pip==26.2",
  "urllib3==2.8.0",
  "virtualenv==21.7.13",
]
