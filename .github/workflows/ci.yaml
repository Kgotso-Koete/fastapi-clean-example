name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Check code
        run: make check-ci

      - name: Test with Docker
        env:
          ALLOW_DESTRUCTIVE_TEST_CLEANUP: 1
        run: make test-docker

      # Fails the run when combined unit + integration coverage drops below
      # MIN_COVERAGE percent. Reads the data make test-docker copied out of
      # its container; make check's unit-only report isn't gated, since
      # adapters are covered by integration tests (the original author's step;
      # docs/plans/15-upstream-autumn-2026.md, Step 6).
      - name: Check coverage
        env:
          MIN_COVERAGE: 75
        run: uv run coverage report --data-file=.coverage.docker --fail-under="${MIN_COVERAGE}"
