server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        # Without this, docker_sd_configs discovers every container on the
        # host's Docker socket -- including ones started by a completely
        # unrelated project/repo also running on this machine, not just
        # this Compose project's own services. `filters` asks the Docker
        # daemon itself to only return containers labeled with THIS
        # project's Compose project name, so nothing outside this repo
        # ever reaches Loki/Grafana in the first place.
        #
        # Compose sets this label to the project name, which the Makefile
        # derives from APP_SERVICE_NAME (see env.example) via `docker
        # compose -p`. ${APP_SERVICE_NAME} below (see docker-compose.yml's
        # promtail service, -config.expand-env) tracks that automatically.
        filters:
          - name: label
            values: ["com.docker.compose.project=${APP_SERVICE_NAME:-fastapi-clean-example}"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "compose_service"
    pipeline_stages:
      # Docker's JSON log driver wraps each line as {"log": "...", "stream": "...", "time": "..."};
      # this unwraps it so downstream stages see the app's own log line.
      - docker: {}
      # The app emits one JSON object per line when APP_LOG_FORMAT=json (see env.example).
      # `level` is deliberately the only field promoted to a Loki label - it's low-cardinality
      # (5 possible values). Everything else (exception_type, path, method, ...) stays in the
      # log line itself and is filtered at query time with `| json` in Grafana Explore, e.g.:
      #   {compose_service="app"} | json | exception_type="ValueError"
      # Promoting high-cardinality fields like `path` to labels instead would blow up Loki's
      # index - this is Loki's own recommended pattern, not specific to this app.
      - json:
          expressions:
            level: level
      - labels:
          level:
