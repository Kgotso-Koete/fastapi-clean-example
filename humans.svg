<svg xmlns="http://www.w3.org/2000/svg" viewBox="76 76 448 448" width="448" height="448" font-family="sans-serif" role="img">
  <title>Learning flywheel: two concentric rings around a centre, each ring a loop of arrows turning clockwise</title>

  <!--
    How this file is laid out:
    - Two rings around the centre point (300, 300), each made of arrow-shaped pieces:
      the inner ring has three pieces, the middle ring has seven.
    - Each piece's pointed end fits into the notch of the next piece, so every ring turns clockwise.
    - Each ring's first piece is drawn at the top; the others are rotated copies of it.
    - To change a label, edit the text between <text ...> and </text> under "LABELS" at the bottom.
  -->

  <!-- MIDDLE RING (radius 160 to 220), seven pieces of 51.43 degrees each -->
  <g fill="#c77d1a">
    <path id="middle-piece" d="M 211.52 98.57 A 220 220 0 0 1 388.48 98.57 L 399.88 138.37 L 364.35 153.51 A 160 160 0 0 0 235.65 153.51 L 248.54 117.10 Z"/>
    <use href="#middle-piece" transform="rotate(51.43 300 300)"/>
    <use href="#middle-piece" transform="rotate(102.86 300 300)"/>
    <use href="#middle-piece" transform="rotate(154.29 300 300)"/>
    <use href="#middle-piece" transform="rotate(205.71 300 300)"/>
    <use href="#middle-piece" transform="rotate(257.14 300 300)"/>
    <use href="#middle-piece" transform="rotate(308.57 300 300)"/>
  </g>

  <!-- INNER RING (radius 90 to 150) -->
  <g fill="#2a9d8f">
    <path id="inner-piece" d="M 172.79 220.51 A 150 150 0 0 1 427.21 220.51 L 409.63 251.19 L 376.32 252.31 A 90 90 0 0 0 223.68 252.31 L 208.08 222.87 Z"/>
    <use href="#inner-piece" transform="rotate(120 300 300)"/>
    <use href="#inner-piece" transform="rotate(240 300 300)"/>
  </g>

  <!-- CENTRE (delete this circle and its label if the centre isn't needed) -->
  <circle cx="300" cy="300" r="78" fill="#e76f51"/>

  <!-- LABELS: listed clockwise from the top of each ring -->
  <g fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="middle">
    <!-- Middle ring: each label is turned (rotate) to follow the ring, so it stays inside its piece -->
    <g font-size="14">
      <text x="323.16" y="111.42" transform="rotate(7 323.16 111.42)">Abstractions</text>
      <text x="461.89" y="200.52" transform="rotate(58.43 461.89 200.52)">Infrastructure</text>
      <text x="478.70" y="364.55" transform="rotate(-70.14 478.70 364.55)">Money</text>
      <text x="360.95" y="479.96" transform="rotate(-18.71 360.95 479.96)">Experience</text>
      <text x="197.32" y="459.87" transform="rotate(32.71 197.32 459.87)">Natural Ability</text>
      <text x="110.99" y="319.40" transform="rotate(84.14 110.99 319.40)">Testability</text>
      <text x="166.99" y="164.32" transform="rotate(-44.43 166.99 164.32)">
        <tspan x="166.99" dy="-0.6em">Feedback Loop</tspan>
        <tspan x="166.99" dy="1.2em">Length</tspan>
      </text>
    </g>

    <!-- Inner ring: each label is turned (rotate) to follow the ring, so it stays inside its piece -->
    <g font-size="13">
      <text x="300" y="180">Designing</text>
      <text x="403.92" y="360" transform="rotate(-60 403.92 360)">Building</text>
      <text x="196.08" y="360" transform="rotate(60 196.08 360)">Testing</text>
    </g>

    <!-- Centre: two lines, one per tspan -->
    <text x="300" y="300" font-size="18">
      <tspan x="300" dy="-0.6em">Discovering</tspan>
      <tspan x="300" dy="1.2em">Order</tspan>
    </text>
  </g>
</svg>
