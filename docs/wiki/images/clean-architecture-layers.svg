<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="900" fill="#ffffff" rx="16"/>

  <!-- Rings, outer to inner: main -> inbound -> outbound -> core -->
  <circle cx="450" cy="460" r="400" fill="#E3E6EA"/>
  <circle cx="450" cy="460" r="305" fill="#90CAF9"/>
  <circle cx="450" cy="460" r="205" fill="#1E88E5"/>
  <circle cx="450" cy="460" r="105" fill="#0D2C6B"/>

  <!-- Ring labels -->
  <text x="450" y="105" text-anchor="middle" font-size="30" font-weight="700" fill="#20242B">main</text>
  <text x="450" y="140" text-anchor="middle" font-size="18" fill="#4B5563">composition root — wires everything together</text>

  <text x="450" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#0D2C6B">inbound</text>
  <text x="450" y="235" text-anchor="middle" font-size="16" fill="#0D2C6B">HTTP adapters — how the outside world reaches in</text>

  <text x="450" y="310" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">outbound</text>
  <text x="450" y="337" text-anchor="middle" font-size="15" fill="#EAF2FF">infrastructure adapters — Postgres, Celery, SMTP</text>

  <text x="450" y="450" text-anchor="middle" font-size="26" font-weight="700" fill="#FFFFFF">core</text>
  <text x="450" y="478" text-anchor="middle" font-size="14" fill="#CFE0FF">business rules — knows nothing</text>
  <text x="450" y="496" text-anchor="middle" font-size="14" fill="#CFE0FF">about HTTP or Postgres</text>

  <!-- Inward-pointing arrow annotation -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#20242B"/>
    </marker>
  </defs>
  <line x1="120" y1="800" x2="330" y2="590" stroke="#20242B" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="60" y="840" font-size="22" font-weight="700" fill="#20242B">imports only point inward</text>
  <text x="60" y="866" font-size="16" fill="#4B5563">enforced by import-linter — never the other way</text>
</svg>
