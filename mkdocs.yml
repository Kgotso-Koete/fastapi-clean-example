site_name: fastapi-clean-example Wiki
site_description: DDD / Clean Architecture / TDD reference — architecture, development guide, and reference material
docs_dir: docs/wiki

theme:
  name: material
  custom_dir: docs/wiki/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mermaid2
  - include-markdown

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - admonition
  - tables
  - toc:
      permalink: true
      title: Sections

nav:
  - Overview: index.md
  - Getting Started:
      - Quick Start with Docker: content/getting-started/quick-start-docker.md
      - Quick Start Locally: content/getting-started/quick-start-local.md
  - Architecture:
      - Layer Dependencies & Import Rules: content/architecture/layer-dependencies.md
      - Core Layer (Domain & Business Rules): content/architecture/core-layer.md
      - Outbound Layer (Infrastructure Adapters): content/architecture/outbound-layer.md
      - Inbound Layer (HTTP / Presentation): content/architecture/inbound-layer.md
