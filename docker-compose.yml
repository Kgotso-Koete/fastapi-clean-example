services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - ENVIRONMENT=dev
    restart: on-failure
    volumes:
      - .:/code
    ports:
      - "127.0.0.1:${UVICORN_PORT}:8000"
    depends_on:
      db_pg:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - COVERAGE_FILE=/tmp/.coverage
    command: ["start", "8000"]

  db_pg:
    image: postgres:18-alpine
    shm_size: 128mb
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 1s

  # --- Celery broker + worker (per-handler background event dispatch) ---
  # See docs/plans/celery-redis-events.md for the full design.

  # Every service below is behind the "celery" Compose profile, activated
  # by default via COMPOSE_PROFILES=celery in env.example -- a deployment
  # that sets CELERY_ENABLED=false (see EventHandler.DISPATCH_MODE
  # fallback in HybridEventDispatcher) can also set COMPOSE_PROFILES=
  # (empty) to skip standing up any of this infrastructure at all. `app`
  # intentionally has no depends_on for `redis` -- it no longer strictly
  # requires it.

  redis:
    image: redis:8-alpine
    restart: on-failure
    profiles: ["celery"]
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 1s

  worker:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - ENVIRONMENT=dev
    restart: on-failure
    profiles: ["celery"]
    volumes:
      - .:/code
    depends_on:
      db_pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    command: ["worker"]
    healthcheck:
      # --timeout gives Celery's own inspect command a generous reply-wait
      # window; Docker's own `timeout:` below is set comfortably longer
      # than that, so a slow-but-fine response isn't mistaken for a hang.
      # start_period is set generously: `docker compose up --wait` treats
      # the *first* "unhealthy" transition as a hard failure rather than
      # polling through to --wait-timeout, and failing checks during
      # start_period never count towards that transition -- this covers
      # the CPU contention of every other service starting up alongside it
      # (observed to fully settle well within this window; the worker
      # itself is typically ready in ~1s once it actually gets scheduled).
      test: ["CMD-SHELL", "celery -A app.main.worker.celery_app:celery_app inspect ping --timeout=8 | grep -q OK"]
      interval: 5s
      timeout: 15s
      retries: 3
      start_period: 45s

  # No separate `beat` service: `worker` drains `event_outbox` itself, via
  # a plain polling loop it starts on its own process (see
  # src/app/main/worker/outbox_drain_loop.py) rather than a Celery Beat
  # schedule. See docs/plans/transactional-outbox.md's "Why not a Celery
  # Beat task" section for why -- in short, a Beat-scheduled task still
  # shows up in Flower/Redis on every tick even when there's nothing to
  # drain, polluting the audit trail a Celery task is otherwise meant to
  # be for this app.

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    profiles: ["celery"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:${FLOWER_PORT}:5555"

  # Redis Commander -- browse the actual Redis contents (broker queue in
  # REDIS_DB, task results in REDIS_RESULT_DB) the way Adminer does for
  # Postgres and Flower does for Celery's own task-level view.
  redis-commander:
    image: rediscommander/redis-commander:latest
    restart: unless-stopped
    profiles: ["celery"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOSTS=broker:redis:6379:0,results:redis:6379:1
    ports:
      - "127.0.0.1:${REDIS_COMMANDER_PORT}:8081"

  # vvv EVERYTHING BELOW THIS LINE IS NEW vvv
  # --- Observability stack (all free/open-source, local-only) ---
  # See README.md "Observability" section for access URLs and what each does.

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.3.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.6.8
    restart: unless-stopped
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db_pg
    depends_on:
      - db_pg

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
